name: Startup and navigation checks
on:
  pull_request:
    paths:
      - "src/routes/__root.tsx"
      - "src/router.tsx"
      - "src/styles.css"
      - "src/components/home/procreate/HeroTapWord.tsx"
      - "src/components/rita-study/RitaCube.tsx"
      - "scripts/check-home-cube.mjs"
      - "src/i18n/**"
      - "src/components/LanguageProvider*"
      - "src/components/ThemeProvider.tsx"
      - "src/components/SiteFooter*"
      - "src/components/learn/**"
      - "scripts/check-learn-navigation.mjs"
      - "scripts/check-question-preview.mjs"
      - "scripts/check-study-help.mjs"
      - "src/components/rita-study/StudyPracticePanel.tsx"
      - "src/components/rita-study/study-practice.css"
      - "src/components/rita-study/QuestionPreview.tsx"
      - "src/components/rita-study/question-preview*"
      - "src/components/rita-study/StudyPage.tsx"
      - "src/components/rita-study/tech-select.ts"
      - "src/components/rita-study/tech-sound*"
      - "src/components/rita-study/reply-selection.ts"
      - "src/components/rita/HoldToStart.tsx"
      - "src/components/rita-study/FloatingWindow.tsx"
      - "src/components/rita-study/radial-items.ts"
      - "public/fonts/quiz/**"
      - "src/lib/footer-links.ts"
      - "src/hooks/usePresence.ts"
      - "src/components/rita-live/VoiceOrb.tsx"
      - "src/lib/site-bootstrap*"
      - "src/lib/startup-cache*"
      - "src/lib/ui-language*"
      - ".github/workflows/startup-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Locale rendering and cache lifecycle regressions
        run: bun test src/lib/ui-language.test.ts src/lib/startup-cache.test.ts src/components/LanguageProvider.test.tsx src/components/SiteFooterView.test.tsx src/lib/learn-home.test.ts src/lib/learning-language.test.ts
      - run: bunx tsc --noEmit
      - name: Temporary question preview state and existing study regressions
        run: bun test src/components/rita-study/question-preview.test.ts src/components/rita-study/window-geometry.test.ts src/lib/study/study-practice.test.ts
      - name: Hold audio lifecycle regressions
        run: node --test src/components/rita-study/tech-sound.test.mjs
      - name: Learning sections in Chromium and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.62.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium webkit
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/check-home-cube.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" BROWSER=webkit node scripts/check-home-cube.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/check-study-help.mjs --check
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" BROWSER=webkit node scripts/check-study-help.mjs --check
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/check-learn-navigation.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" BROWSER=webkit node scripts/check-learn-navigation.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/check-question-preview.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" BROWSER=webkit node scripts/check-question-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-navigation-preview
          path: |
            output/learn-preview/
            output/question-preview/
            output/study-help/
          if-no-files-found: ignore
      - run: bun run build
