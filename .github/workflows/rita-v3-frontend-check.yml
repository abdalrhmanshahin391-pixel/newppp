name: Rita v3 frontend checks

on:
  pull_request:
    paths:
      - "src/components/rita/RitaRealtimeV3.tsx"
      - "src/components/rita-hub/RitaHub.tsx"
      - "src/lib/rita-conversation*"
      - "src/lib/rita-v3-heard*"
      - "src/routes/api/rita-v3/session/**"
      - "src/routes/rita-conversations.tsx"
      - "src/routes/rita-live.tsx"
      - "src/integrations/supabase/types.ts"
      - "supabase/migrations/20261019120000_rita_free_conversations.sql"
      - "voice-agent/bot.py"
      - "voice-agent/tests/test_rita_conversation_history.py"
      - "src/lib/rita-v3-startup*"
      - "src/lib/rita-curriculum*"
      - "src/components/rita-lessons/**"
      - "src/routes/rita-lessons.tsx"
      - "src/routes/admin.curricula.tsx"
      - "src/lib/learning-language*"
      - "src/lib/rita-target-language*"
      - "src/lib/language-scope.ts"
      - "src/lib/language-flags*"
      - "src/lib/language-splash*"
      - "public/flags/**"
      - "src/components/home/procreate/ProHeader.tsx"
      - "supabase/migrations/20261020220000_language_flags.sql"
      - "src/hooks/useLearningLanguage.ts"
      - "src/components/language/**"
      - "src/routes/admin.languages.tsx"
      - "supabase/migrations/20261020180000_learning_languages.sql"
      - "docs/curriculum-samples/**"
      - "src/lib/rita-lesson-*"
      - "supabase/functions/**"
      - "src/lib/guides/**"
      - "guides-worker/**"
      - "supabase/migrations/20261027120000_rita_lesson_guides.sql"
      - "supabase/migrations/20261028120000_rita_study_lessons.sql"
      - "supabase/migrations/20261028140000_rita_study_actions.sql"
      - "supabase/migrations/20261029100000_rita_study_switch_on.sql"
      - "src/routes/admin.curricula.tsx"
      - "voice-agent/rita_study_voice.py"
      - "supabase/tests/**"
      - "scripts/test-study-db.sh"
      - "src/lib/study/**"
      - "src/components/rita-study/**"
      - "src/routes/rita-study.tsx"
      - "src/components/rita-lessons/admin/**"
      - "public/fonts/guides/**"
      - "supabase/config.toml"
      - "scripts/sync-lesson-edge.mjs"
      - ".github/workflows/rita-v3-frontend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check startup regressions and types
        run: |
          node --test src/lib/rita-v3-startup.test.mjs
          node --test src/lib/rita-v3-diagnostics-trace.test.mjs
          node --test src/lib/rita-v3-heard.test.ts
          node --test src/lib/rita-conversation.test.ts
          node --test src/lib/rita-curriculum.test.ts
          node --test src/lib/rita-slides.test.ts
          node --test src/lib/rita-resources.test.ts
          node --test src/lib/rita-image-request.test.ts
          node --test src/lib/learn-home.test.ts
          node --test src/lib/rita-phrase.test.ts
          node --test src/lib/activity-streak.test.ts
          node --test src/lib/learning-language.test.ts
          node --test src/lib/language-flags.test.ts
          node --test src/lib/rita-target-language.test.ts
          node --test src/lib/vision-check-image.test.ts
          node --test src/lib/page-transcript.test.ts
          node --test src/lib/page-reading.test.ts
          node --test src/lib/model-reply-normalize.test.ts
          node --test src/lib/rita-engine-check.test.ts
          node --test src/lib/rita-lesson-engine.test.ts
          node --test src/lib/rita-lesson-grader.test.ts
          node --test src/lib/rita-lesson-run.test.ts
          node --test src/lib/rita-lesson-run.core.test.ts
          node --test src/lib/rita-lesson-edge-sync.test.ts
          node --test src/lib/guides/guide.test.ts
          node --test src/lib/guides/guide-pipeline.test.ts
          node --test src/lib/guides/guide-blocks.test.ts
          node --test src/lib/study/study-experience.test.ts
          node --test src/lib/study/study-link.test.ts
          node --test src/lib/study/study-selection.test.ts
          node --test src/components/rita-study/orb-position.test.ts
          node --test src/components/rita-study/study-memory.test.ts
          node --test src/lib/study/study-request-state.test.ts
          node --test src/lib/study/study-access.test.ts
          node --test src/lib/study/study-voice-brief.test.ts
          node --test src/lib/study/lesson-maker.test.ts
          node --test src/lib/language-splash.test.ts
          node --test src/routes/api/rita-v3/session/start.source.test.mjs
          bunx tsc --noEmit
      - name: Study page selection in a real browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" \
            node --test src/components/rita-study/selection.browser.test.ts
      - name: Build site
        run: bun run build

  study-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Interactive study database rules (real migrations on Postgres 16)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/test-study-db.sh
