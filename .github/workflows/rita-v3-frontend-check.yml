name: Rita v3 frontend checks

on:
  pull_request:
    paths:
      - "src/components/rita/RitaRealtimeV3.tsx"
      - "src/components/rita-hub/RitaHub.tsx"
      - "src/lib/rita-conversation*"
      - "src/lib/rita-v3-heard*"
      - "src/routes/api/rita-v3/session/**"
      - "src/routes/rita-conversations.tsx"
      - "src/routes/rita-live.tsx"
      - "src/integrations/supabase/types.ts"
      - "supabase/migrations/20261019120000_rita_free_conversations.sql"
      - "voice-agent/bot.py"
      - "voice-agent/tests/test_rita_conversation_history.py"
      - "src/lib/rita-v3-startup*"
      - "src/lib/rita-curriculum*"
      - "src/components/rita-lessons/**"
      - "src/routes/rita-lessons.tsx"
      - "src/routes/admin.curricula.tsx"
      - "docs/curriculum-samples/**"
      - ".github/workflows/rita-v3-frontend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check startup regressions and types
        run: |
          node --test src/lib/rita-v3-startup.test.mjs
          node --test src/lib/rita-v3-diagnostics-trace.test.mjs
          node --test src/lib/rita-v3-heard.test.ts
          node --test src/lib/rita-conversation.test.ts
          node --test src/lib/rita-curriculum.test.ts
          node --test src/lib/rita-slides.test.ts
          node --test src/lib/rita-resources.test.ts
          node --test src/lib/rita-image-request.test.ts
          node --test src/lib/learn-home.test.ts
          node --test src/lib/activity-streak.test.ts
          bunx tsc --noEmit
      - name: Build site
        run: bun run build
