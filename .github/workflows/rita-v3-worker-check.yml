name: Rita v3 worker checks

on:
  push:
    branches: [rita-v3-latency-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned voice worker dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pipecat-ai[daily,groq,local-smart-turn,runner,silero,soniox]==0.0.105' \
            'google-genai[aiohttp]>=2.25.0,<3' 'python-dotenv>=1.1.0,<2' pytest
      - name: Check worker code and regressions
        working-directory: voice-agent
        run: |
          python -m compileall -q bot.py rita_gemini_tts.py rita_latency.py rita_state.py voice_probe.py
          python -m pytest tests -q
