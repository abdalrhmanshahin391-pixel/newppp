name: Rita v3 short voice probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-probe:
    runs-on: ubuntu-24.04
    # The apt and Daily wheels can take several minutes on a cold GitHub runner.
    # Keep the actual session probe bounded in voice_probe.py instead of letting
    # dependency installation consume the whole job timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve bounded synthetic voice tools
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if ! command -v espeak-ng >/dev/null 2>&1 && ! command -v espeak >/dev/null 2>&1; then
            packages+=(espeak-ng)
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          if ((${#packages[@]})); then
            sudo timeout 120s apt-get update
            sudo timeout 180s apt-get install -y "${packages[@]}"
          fi
          espeak_path="$(command -v espeak-ng || command -v espeak)"
          ffmpeg_path="$(command -v ffmpeg)"
          test -n "$espeak_path" && test -n "$ffmpeg_path"
          echo "RITA_ESPEAK=$espeak_path" >> "$GITHUB_ENV"
      - name: Install pinned Daily and Modal clients
        run: timeout 480s python -m pip install --disable-pip-version-check --progress-bar off daily-python==0.33.0 modal==1.6.2
      - name: Synthesize bounded test prompts
        shell: bash
        run: |
          mkdir -p voice-probe-input voice-probe-output
          "$RITA_ESPEAK" -v ar -s 145 -w /tmp/meaning.wav 'شو معنى غوتن مورغن؟'
          "$RITA_ESPEAK" -v ar -s 145 -w /tmp/switch.wav 'احكي معي بالألماني من هسا.'
          "$RITA_ESPEAK" -v ar -s 145 -w /tmp/general.wav 'شو صار بحرب المغول؟'
          "$RITA_ESPEAK" -v ar -s 145 -w /tmp/interrupt.wav 'استني، مش فاهم.'
          ffmpeg -v error -i /tmp/meaning.wav -ar 16000 -ac 1 -sample_fmt s16 voice-probe-input/01-meaning.wav
          ffmpeg -v error -i /tmp/switch.wav -ar 16000 -ac 1 -sample_fmt s16 voice-probe-input/02-switch.wav
          ffmpeg -v error -i /tmp/general.wav -ar 16000 -ac 1 -sample_fmt s16 voice-probe-input/03-general.wav
          ffmpeg -v error -i /tmp/interrupt.wav -ar 16000 -ac 1 -sample_fmt s16 voice-probe-input/04-interrupt.wav
      - name: Show which probe settings are present (names only, never values)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          for name in MODAL_TOKEN_ID MODAL_TOKEN_SECRET; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: MISSING"; fi
          done
      - name: Probe one deployed Modal session (120s readiness plus 60s voice, no retry)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RITA_PROBE_USE_MODAL_RPC: "1"
        run: python voice-agent/voice_probe.py --input-dir voice-probe-input --output-dir voice-probe-output
      - name: Retain synthetic recording and measurements for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rita-v3-synthetic-voice-probe
          path: voice-probe-output/
          retention-days: 1
          if-no-files-found: warn
