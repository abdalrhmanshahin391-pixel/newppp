name: Rita content probe

# Asks the real model a fixed set of questions with the worker's real prompt and checks what it
# writes (wrong German rules, numbered lists, the wrong reply language, forced follow-ups).
# Run it by hand after a prompt change: Actions > Rita content probe > Run workflow.
# Needs the repository secret GROQ_API_KEY (the same key the voice worker uses).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned voice worker dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pipecat-ai[daily,groq,runner,silero,soniox]==0.0.105' \
            'google-genai[aiohttp]>=2.25.0,<3' 'python-dotenv>=1.1.0,<2'
      - name: Say whether the key is present (never its value)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then echo "GROQ_API_KEY: set"; else echo "GROQ_API_KEY: MISSING (add it under Settings > Secrets and variables > Actions)"; fi
      - name: Run the content probe
        working-directory: voice-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python rita_content_probe.py
