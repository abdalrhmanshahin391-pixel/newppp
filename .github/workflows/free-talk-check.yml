name: Free conversation budget checks
on:
  pull_request:
    branches: [main]
    paths:
      [
        "src/**free-talk*",
        "src/hooks/useVoiceTime.ts",
        "src/components/VoiceTime.tsx",
        "src/components/CreditsMeter.tsx",
        "src/routes/api/rita-v3/**",
        "voice-agent/**",
        "supabase/**free*",
        "scripts/test-free-talk-db.mjs",
        ".github/workflows/free-talk-check.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uzyra_free_talk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Real PostgreSQL permissions, quotas and simultaneous starts
        env:
          FREE_TALK_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/uzyra_free_talk_test
        run: node scripts/test-free-talk-db.mjs
      - run: node --test src/lib/free-talk-time.test.ts src/lib/rita-v3-startup.test.mjs src/lib/rita-voice-connection.test.ts
      - run: bunx tsc --noEmit
      - run: bun run build
