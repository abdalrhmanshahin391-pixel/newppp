name: Settings workspace checks
on:
  pull_request:
    paths:
      - "src/components/settings/**"
      - "src/lib/settings*"
      - "src/lib/subscription*"
      - "src/routes/settings.tsx"
      - "src/routes/profile.tsx"
      - "src/routes/my-plan.tsx"
      - "scripts/check-settings.mjs"
      - ".github/workflows/settings-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Settings and billing invariants
        run: bun test src/lib/settings.test.ts src/lib/subscription-management.test.ts src/lib/subscription.functions.test.ts src/components/SiteFooterView.test.tsx
      - name: Types and settings lint
        run: |
          bunx tsc --noEmit
          bunx eslint src/components/settings src/lib/settings.ts src/lib/settings.test.ts src/lib/subscription-management.ts src/lib/subscription-management.test.ts src/lib/subscription.functions.ts src/lib/subscription.functions.test.ts src/routes/settings.tsx src/routes/profile.tsx src/routes/my-plan.tsx scripts/check-settings.mjs
      - name: Offline settings in Chromium and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.62.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium webkit
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/check-settings.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" BROWSER=webkit node scripts/check-settings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-preview
          path: output/settings-preview/
          if-no-files-found: ignore
      - name: Production build
        run: bun run build
